<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="32" fill="#4a7d87"/>

  <!-- cape, extending to the bottom edge -->
  <path d="M20,36 C20,36 12,48 10,66 L54,66 C52,48 44,36 44,36 Z" fill="#a01f28"/>

  <!-- arms raised, fists up -->
  <path d="M23,38 C16,34 11,28 9,21" stroke="#1d2f6e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M41,38 C48,34 53,28 55,21" stroke="#1d2f6e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- gloves: fist + thumbs up -->
  <ellipse cx="8" cy="20.5" rx="4.5" ry="4.8" fill="#ffffff"/>
  <ellipse cx="8" cy="14.5" rx="1.7" ry="2.3" fill="#ffffff"/>
  <ellipse cx="56" cy="20.5" rx="4.5" ry="4.8" fill="#ffffff"/>
  <ellipse cx="56" cy="14.5" rx="1.7" ry="2.3" fill="#ffffff"/>

  <!-- torso, extending to the bottom edge -->
  <path d="M20,38 C20,30 24,26 32,26 C40,26 44,30 44,38 L44,66 L20,66 Z" fill="#1d2f6e"/>

  <!-- shield -->
  <rect x="25.5" y="33.5" width="13" height="13" rx="2" transform="rotate(45 32 40)" fill="#f4c430" stroke="#a01f28" stroke-width="1.6"/>
  <text x="32" y="43.5" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="9" fill="#7a1420">AS</text>

  <!-- hair: rounded top, sides come down to eye level -->
  <path d="M22,21.5 L22,15 C22,9 26,6 32,6 C38,6 42,9 42,15 L42,21.5 Z" fill="#1c1c22"/>

  <!-- face -->
  <ellipse cx="32" cy="21.5" rx="8.3" ry="8.6" fill="#f2cda0"/>

  <!-- face details -->
  <path d="M27,18.5 L29.5,17.8" stroke="#3a2a1a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M37,18.5 L34.5,17.8" stroke="#3a2a1a" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="28.5" cy="21.5" r="1" fill="#2a2018"/>
  <circle cx="35.5" cy="21.5" r="1" fill="#2a2018"/>
  <path d="M29,26 C30.5,27.5 33.5,27.5 35,26" stroke="#b5563f" stroke-width="1.1" stroke-linecap="round" fill="none"/>
</svg>
